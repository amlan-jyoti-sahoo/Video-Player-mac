<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Local Video Player</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="dynamicBackdrop" class="dynamic-backdrop" aria-hidden="true"></div>
    <main class="app">
      <section class="player-card">
        <div class="layout-shell">
          <section id="playlistSidebar" class="playlist-sidebar" aria-label="Video list panel">
            <div class="sidebar-head">
              <h1>Local Video Player</h1>
              <button id="sidebarToggle" class="sidebar-toggle" type="button" aria-expanded="true" aria-label="Collapse video list">
                <span aria-hidden="true">&#10094;</span>
              </button>
            </div>
            <div class="playlist-wrap" aria-label="Video list">
              <div class="source-row">
                <p id="sourceLabel" class="source-label"></p>
                <p id="sourceDuration" class="source-duration"></p>
              </div>
              <div class="view-toggle" role="group" aria-label="Preview layout">
                <button id="viewGrid" type="button" class="view-toggle-btn selected">Grid</button>
                <button id="viewList" type="button" class="view-toggle-btn">List</button>
              </div>
              <div id="playlist" class="playlist"></div>
            </div>
          </section>

          <div id="sidebarResizer" class="sidebar-resizer" role="separator" aria-label="Resize sidebar"></div>

          <section class="main-panel">
            <div class="picker-row">
              <button id="openNative" type="button">Open Video</button>
              <button id="openFolder" type="button">Open Folder</button>
              <span class="drop-label">Drag and drop a video file or folder here</span>
            </div>

            <div class="now-playing-row">
              <p id="currentFileName" class="current-file-name">No file selected</p>
              <button id="infoButton" class="info-btn" type="button" aria-label="Get video info">i</button>
            </div>

            <section id="playerShell" class="player-shell" aria-label="Main player">
              <div class="video-stage">
                <video id="video" preload="metadata"></video>

                <!-- Secret Mode Banners (one per direction, independently draggable) -->
                <div id="secretBannerTop" class="secret-banner secret-banner-top" aria-hidden="true">
                  <div class="secret-banner-handle" title="Drag to expand">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="7" r="1.4" fill="currentColor"/><circle cx="15" cy="7" r="1.4" fill="currentColor"/><circle cx="9" cy="12" r="1.4" fill="currentColor"/><circle cx="15" cy="12" r="1.4" fill="currentColor"/><circle cx="9" cy="17" r="1.4" fill="currentColor"/><circle cx="15" cy="17" r="1.4" fill="currentColor"/></svg>
                  </div>
                </div>
                <div id="secretBannerBottom" class="secret-banner secret-banner-bottom" aria-hidden="true">
                  <div class="secret-banner-handle" title="Drag to expand">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="7" r="1.4" fill="currentColor"/><circle cx="15" cy="7" r="1.4" fill="currentColor"/><circle cx="9" cy="12" r="1.4" fill="currentColor"/><circle cx="15" cy="12" r="1.4" fill="currentColor"/><circle cx="9" cy="17" r="1.4" fill="currentColor"/><circle cx="15" cy="17" r="1.4" fill="currentColor"/></svg>
                  </div>
                </div>
                <div id="secretBannerLeft" class="secret-banner secret-banner-left" aria-hidden="true">
                  <div class="secret-banner-handle" title="Drag to expand">
                    <svg viewBox="0 0 24 24" aria-hidden="true" style="transform:rotate(90deg)"><circle cx="9" cy="7" r="1.4" fill="currentColor"/><circle cx="15" cy="7" r="1.4" fill="currentColor"/><circle cx="9" cy="12" r="1.4" fill="currentColor"/><circle cx="15" cy="12" r="1.4" fill="currentColor"/><circle cx="9" cy="17" r="1.4" fill="currentColor"/><circle cx="15" cy="17" r="1.4" fill="currentColor"/></svg>
                  </div>
                </div>
                <div id="secretBannerRight" class="secret-banner secret-banner-right" aria-hidden="true">
                  <div class="secret-banner-handle" title="Drag to expand">
                    <svg viewBox="0 0 24 24" aria-hidden="true" style="transform:rotate(90deg)"><circle cx="9" cy="7" r="1.4" fill="currentColor"/><circle cx="15" cy="7" r="1.4" fill="currentColor"/><circle cx="9" cy="12" r="1.4" fill="currentColor"/><circle cx="15" cy="12" r="1.4" fill="currentColor"/><circle cx="9" cy="17" r="1.4" fill="currentColor"/><circle cx="15" cy="17" r="1.4" fill="currentColor"/></svg>
                  </div>
                </div>

                <div id="fullscreenNavZone" class="fullscreen-nav-zone" aria-hidden="true">
                  <button id="prevVideoButton" class="fullscreen-nav-btn prev" type="button" aria-label="Previous video">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                      <path d="M15 18l-6-6 6-6" />
                    </svg>
                  </button>
                  <button id="nextVideoButton" class="fullscreen-nav-btn next" type="button" aria-label="Next video">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                      <path d="M9 6l6 6-6 6" />
                    </svg>
                  </button>
                </div>

                <div id="retryOverlay" class="retry-overlay" hidden>
                  <button id="retryButton" class="retry-btn" type="button">
                    <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <polyline points="1 4 1 10 7 10"></polyline>
                      <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
                    </svg>
                    <span>Play Again</span>
                  </button>
                </div>

                <div id="overlayControls" class="overlay-controls">
                  <div class="overlay-top-row">
                    <button id="timeModeButton" class="time-chip" type="button" aria-label="Toggle time display">00:00 / 00:00</button>
                    <div class="overlay-actions">
                      <button id="controlsLockButton" class="overlay-icon-btn control-lock-btn" type="button" aria-pressed="false" aria-label="Keep controls visible">
                        <svg id="controlsLockIcon" viewBox="0 0 24 24" aria-hidden="true">
                          <path d="M4 7h16" />
                          <path d="M7 12h10" />
                          <path d="M10 17h4" />
                          <circle cx="16" cy="7" r="2" />
                          <circle cx="8" cy="12" r="2" />
                          <circle cx="14" cy="17" r="2" />
                        </svg>
                      </button>

                      <div class="speed-wrap">
                        <button id="speedButton" class="speed-btn" type="button" aria-haspopup="true" aria-expanded="false">1x</button>
                        <div id="speedPopover" class="speed-popover" hidden>
                          <div id="speedMenu" class="speed-menu">
                            <button data-speed="0.5" type="button" class="speed-option">0.5x</button>
                            <button data-speed="0.75" type="button" class="speed-option">0.75x</button>
                            <button data-speed="1" type="button" class="speed-option selected">1x</button>
                            <button data-speed="1.5" type="button" class="speed-option">1.5x</button>
                            <button data-speed="2" type="button" class="speed-option">2x</button>
                            <button id="customSpeedButton" type="button" class="speed-option">Custom</button>
                          </div>

                          <div id="customSpeedInputWrap" class="custom-speed-wrap" hidden>
                            <input id="customSpeedInput" type="number" min="0.25" max="4" step="0.25" placeholder="e.g. 1.25" />
                            <button id="applyCustomSpeed" type="button">Set</button>
                          </div>
                        </div>
                      </div>

                      <button id="pipButton" class="overlay-icon-btn" type="button" aria-label="Picture in Picture">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                          <path d="M3 5h18v14H3zM13 12h7v5h-7z" />
                        </svg>
                      </button>

                      <!-- Secret Mode -->
                      <div class="secret-mode-wrap">
                        <button id="secretModeButton" class="overlay-icon-btn secret-mode-btn" type="button" aria-label="Secret mode crop" aria-haspopup="true" aria-expanded="false">
                          <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94" />
                            <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19" />
                            <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24" />
                            <line x1="1" y1="1" x2="23" y2="23" />
                          </svg>
                        </button>
                        <div id="secretModeMenu" class="secret-mode-menu" hidden>
                          <p class="secret-menu-label">Hide from&hellip;</p>
                          <div class="secret-dir-grid">
                            <button class="secret-dir-btn" data-dir="top" type="button" aria-label="Hide from top" aria-pressed="false">
                              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg>
                              Top
                            </button>
                            <button class="secret-dir-btn" data-dir="right" type="button" aria-label="Hide from right" aria-pressed="false">
                              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5l7 7-7 7"/></svg>
                              Right
                            </button>
                            <button class="secret-dir-btn" data-dir="left" type="button" aria-label="Hide from left" aria-pressed="false">
                              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
                              Left
                            </button>
                            <button class="secret-dir-btn" data-dir="bottom" type="button" aria-label="Hide from bottom" aria-pressed="false">
                              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14"/><path d="M19 12l-7 7-7-7"/></svg>
                              Bottom
                            </button>
                          </div>
                          <button id="secretDismissAll" class="secret-dismiss-btn" type="button" aria-label="Dismiss all secret banners">
                            <svg viewBox="0 0 24 24" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                            Dismiss All
                          </button>
                        </div>
                      </div>

                      <button id="fullscreenToggleButton" class="overlay-icon-btn" type="button" aria-label="Toggle maximize">
                        <svg id="fullscreenIcon" viewBox="0 0 24 24" aria-hidden="true">
                          <path d="M3 9V3h6M15 3h6v6M21 15v6h-6M9 21H3v-6" />
                        </svg>
                      </button>
                    </div>
                  </div>

                  <div class="timeline-row">
                    <button id="playPauseButton" class="play-pause-btn" type="button" aria-label="Play or pause video">
                      <svg id="playPauseIcon" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M8 5v14l11-7z" />
                      </svg>
                    </button>

                    <div id="timeline" class="timeline" aria-label="Seek timeline">
                      <div id="timelineProgress" class="timeline-progress"></div>
                      <div id="timelineKnob" class="timeline-knob" aria-hidden="true"></div>
                      <div id="timelinePreview" class="timeline-preview" hidden>
                        <img id="timelinePreviewImage" alt="Timeline preview" />
                        <p id="timelinePreviewTime" class="timeline-preview-time">00:00</p>
                      </div>
                    </div>
                  </div>
                </div>
              </div>

              <div class="player-quick-actions">
                <span class="quick-hint">Space play/pause | ← → seek | F fullscreen | I info</span>
              </div>
            </section>

            <p id="status" class="status">Select a video file to start.</p>
          </section>
        </div>
      </section>
    </main>

    <dialog id="infoDialog" class="info-dialog">
      <h2>Video Info</h2>
      <p id="infoContent" class="info-content"></p>
      <form method="dialog">
        <button type="submit">Close</button>
      </form>
    </dialog>

    <script src="script.js"></script>
  </body>
</html>
